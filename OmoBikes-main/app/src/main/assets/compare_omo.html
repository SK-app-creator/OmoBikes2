<div class="page-width">
  <header class="section-header text-center">
    <h1>{{ page.title }}</h1>
  </header>

  <style>
    /* Styling for a clean, modern bike shop feel */
    .hero-banner { background: #1b5e20; padding: 40px 20px; text-align: center; border-radius: 12px; margin-bottom: 30px; }
    .hero-banner h2 { color: #fff; margin: 0; font-size: 24px; }
    .hero-banner p { color: #a5d6a7; margin-top: 10px; }

    .selection-panel { max-width: 900px; margin: 0 auto 40px; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid #e0e0e0; }
    .selection-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 25px; }
    @media (max-width: 600px) { .selection-grid { grid-template-columns: 1fr; } }
    
    .select-box label { display: block; font-weight: bold; margin-bottom: 8px; color: #1b5e20; font-size: 14px; text-transform: uppercase; }
    .select-box select { width: 100%; padding: 12px; border: 2px solid #c8e6c9; border-radius: 8px; font-size: 15px; cursor: pointer; }
    
    .btn-compare { width: 100%; background: #1b5e20; color: #fff; padding: 15px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.3s; }
    .btn-compare:hover { background: #2e7d32; }

    /* Comparison Table Styling */
    .comparison-container { display: none; max-width: 1100px; margin: 0 auto; overflow-x: auto; }
    .comp-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    
    .comp-header { background: #1b5e20; color: #fff; }
    .comp-header th { padding: 20px; text-align: left; border-right: 1px solid rgba(255,255,255,0.1); }
    .comp-header th:first-child { width: 25%; }
    
    .category-row { background: #e8f5e9; }
    .category-row td { padding: 12px 20px; font-weight: bold; color: #1b5e20; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
    
    .data-row td { padding: 15px 20px; border-bottom: 1px solid #f0f0f0; font-size: 14px; color: #333; border-right: 1px solid #f0f0f0; }
    .spec-label { font-weight: 600; background: #fafafa; color: #666; }

    .btn-reset { margin-top: 20px; background: transparent; border: 2px solid #1b5e20; color: #1b5e20; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>

  <div class="hero-banner">
    <h2>Find Your Perfect Ride</h2>
    <p>Compare components, gears, and frames across our entire 2026 collection</p>
  </div>

  <div class="selection-panel" id="panelView">
    <div class="selection-grid">
      <div class="select-box">
        <label>Select First Bicycle</label>
        <select id="bikeA"><option value="">-- Choose a Model --</option></select>
      </div>
      <div class="select-box">
        <label>Select Second Bicycle</label>
        <select id="bikeB"><option value="">-- Choose a Model --</option></select>
      </div>
    </div>
    <button class="btn-compare" onclick="runComparison()">Compare Specifications</button>
    <p id="errorMsg" style="color: #c62828; display: none; margin-top: 15px; font-weight: bold; text-align: center;"></p>
  </div>

  <div class="comparison-container" id="resultsView">
    <table class="comp-table">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
    <button class="btn-reset" onclick="resetPage()">← Back to Selection</button>
  </div>

      { type: 'cat', label: 'Drivetrain' },
      { type: 'row', label: 'Crankset', key: 'Crank' },
      { type: 'row', label: 'Bottom Bracket', key: 'BB' },
      { type: 'row', label: 'Cassette/Freewheel', key: 'FW/CS' },
      { type: 'row', label: 'Chain', key: 'Chain' },
      { type: 'cat', label: 'Wheels & Hubs' },
      { type: 'row', label: 'Tires', key: 'Tyre' },
      { type: 'row', label: 'Front Hub', key: 'Hub F' },
      { type: 'row', label: 'Rear Hub', key: 'Hub R' },
      { type: 'cat', label: 'Cockpit & Comfort' },
      { type: 'row', label: 'Handlebar', key: 'Handlebar' },
      { type: 'row', label: 'Stem', key: 'Stem' },
      { type: 'row', label: 'Seat Post', key: 'Seat Post' },
      { type: 'row', label: 'Pedals', key: 'Pedal' },
      { type: 'row', label: 'Grips', key: 'Grips' }
    ];

    function init() {
      const sortedBikes = Object.keys(bikeData).sort();
      const selA = document.getElementById('bikeA');
      const selB = document.getElementById('bikeB');
      
      sortedBikes.forEach(name => {
        selA.options.add(new Option(name, name));
        selB.options.add(new Option(name, name));
      });
    }

    function runComparison() {
      const valA = document.getElementById('bikeA').value;
      const valB = document.getElementById('bikeB').value;
      const error = document.getElementById('errorMsg');

      if (!valA || !valB) {
        error.textContent = "⚠ Please select two bicycles to compare.";
        error.style.display = 'block';
        return;
      }
      if (valA === valB) {
        error.textContent = "⚠ Please select two different models.";
        error.style.display = 'block';
        return;
      }

      error.style.display = 'none';
      renderTable(valA, valB);
      document.getElementById('panelView').style.display = 'none';
      document.getElementById('resultsView').style.display = 'block';
    }

    function renderTable(bikeAName, bikeBName) {
      const bikeA = bikeData[bikeAName];
      const bikeB = bikeData[bikeBName];
      
      // Build Header
      document.getElementById('tableHead').innerHTML = `
        <tr class="comp-header">
          <th>Specifications</th>
          <th>${bikeAName}</th>
          <th>${bikeBName}</th>
        </tr>
      `;

      // Build Body
      let bodyHtml = '';
      tableStructure.forEach(item => {
        if (item.type === 'cat') {
          bodyHtml += `<tr class="category-row"><td colspan="3">${item.label}</td></tr>`;
        } else {
          bodyHtml += `
            <tr class="data-row">
              <td class="spec-label">${item.label}</td>
              <td>${bikeA[item.key] || 'N/A'}</td>
              <td>${bikeB[item.key] || 'N/A'}</td>
            </tr>
          `;
        }
      });
      document.getElementById('tableBody').innerHTML = bodyHtml;
    }

    function resetPage() {
      document.getElementById('resultsView').style.display = 'none';
      document.getElementById('panelView').style.display = 'block';
    }

    init();
  </script>
</div>
