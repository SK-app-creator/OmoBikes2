<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>OmoBikes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; font-family: sans-serif; background: #f0f7f0; -webkit-overflow-scrolling: touch; }

    /* Fix 1 — taller header, bigger font */
    .hdr { background: #1b5e20; padding: 22px 16px; text-align: center; }
    .hdr p { color: #a5d6a7; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }

    /* Fix 2 — 75% card so ~25% of next is visible, image height -10% */
    .slide-box { position: relative; width: 100%; overflow: hidden; background: #fff; border-top: 1px solid #e8f5e9; border-bottom: 1px solid #e8f5e9; }
    .slide-track { display: flex; flex-direction: row; flex-wrap: nowrap; transition: transform 0.3s ease; }
    .slide-item { flex: 0 0 75%; width: 75%; min-width: 75%; max-width: 75%; padding: 8px 8px 8px 14px; }
    .nav-btn { display: none; }

    .dots { display: flex; justify-content: center; gap: 5px; padding: 7px 0; }
    .dots span { width: 6px; height: 6px; border-radius: 50%; background: #c8e6c9; display: inline-block; transition: all 0.2s; }
    .dots span.on { background: #2e7d32; width: 14px; border-radius: 3px; }

    .btns { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .btn { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid #e0e0e0; border-radius: 16px; padding: 16px 18px; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.15s; }
    .btn:active { background: #f5f5f5; }
    .btn-l { display: flex; align-items: center; gap: 14px; }
    .btn-ic { width: 46px; height: 46px; background: #e8f5e9; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .btn-tx h3 { font-size: 15px; font-weight: 600; color: #111; margin-bottom: 3px; }
    .btn-tx p { font-size: 12px; color: #888; line-height: 1.4; }
    .btn-ar { font-size: 20px; color: #2e7d32; font-weight: bold; }

    .footer { text-align: center; padding: 14px; font-size: 11px; color: #bbb; }
  </style>
</head>

<script>
  var idx = 0;
  var total = 5;
  var cardW = 75; // card is 80% wide

  function mv(dir) {
    idx = (idx + dir + total) % total;
    document.getElementById('cTrack').style.transform = 'translateX(-' + (idx * cardW) + '%)';
    var dots = document.getElementById('cDots').querySelectorAll('span');
    dots.forEach(function(d, i) { d.className = i === idx ? 'on' : ''; });
  }

  function go(file) { window.location.href = file; }

  // Swipe
  var sx = 0;
  var box = document.getElementById('cBox');
  box.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; }, {passive:true});
  box.addEventListener('touchend', function(e){
    var dx = sx - e.changedTouches[0].clientX;
    if (Math.abs(dx) > 30) mv(dx > 0 ? 1 : -1);
  }, {passive:true});
</script>
