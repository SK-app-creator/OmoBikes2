<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>OmoBikes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100vh; font-family: sans-serif; background: #f0f7f0; overflow-x: hidden; -webkit-overflow-scrolling: touch; }

    /* HEADER */
    .hdr { background: #1b5e20; padding: 14px 16px; text-align: center; }
    .hdr p { color: #a5d6a7; font-size: 11px; letter-spacing: 1px; }

    /* SECTION TITLE */
    .sec { display: flex; align-items: center; gap: 8px; padding: 12px 16px 6px; }
    .sec span { font-size: 14px; font-weight: 600; color: #1b5e20; }
    .sec-line { flex: 1; height: 1px; background: #c8e6c9; }

    /* SLIDER */
    .slide-box { position: relative; width: 100%; overflow: hidden; background: #fff; border-top: 1px solid #e8f5e9; border-bottom: 1px solid #e8f5e9; }
    .slide-track { display: flex; flex-direction: row; flex-wrap: nowrap; transition: transform 0.3s ease; }
    .slide-item { flex: 0 0 100%; width: 100%; min-width: 100%; max-width: 100%; padding: 10px 18px; }
    .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(27,94,32,0.18); border: none; border-radius: 50%; width: 34px; height: 34px; font-size: 20px; color: #1b5e20; cursor: pointer; z-index: 5; display: flex; align-items: center; justify-content: center; }
    .nav-btn.lft { left: 4px; }
    .nav-btn.rgt { right: 4px; }

    /* DOTS */
    .dots { display: flex; justify-content: center; gap: 5px; padding: 7px 0; }
    .dots span { width: 6px; height: 6px; border-radius: 50%; background: #c8e6c9; display: inline-block; transition: all 0.2s; }
    .dots span.on { background: #2e7d32; width: 14px; border-radius: 3px; }

    /* BUTTONS */
    .btns { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .btn { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid #e0e0e0; border-radius: 16px; padding: 16px 18px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .btn-l { display: flex; align-items: center; gap: 14px; }
    .btn-ic { width: 46px; height: 46px; background: #e8f5e9; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .btn-tx h3 { font-size: 15px; font-weight: 600; color: #111; margin-bottom: 3px; }
    .btn-tx p { font-size: 12px; color: #888; }
    .btn-ar { font-size: 20px; color: #2e7d32; font-weight: bold; }

    .divider { height: 1px; background: #e8f5e9; margin: 4px 16px; }
    .footer { text-align: center; padding: 12px; font-size: 11px; color: #bbb; }
  </style>
</head>

<script>
  var state = { c: 0, p: 0 };
  var total = 5;

  function mv(id, dir) {
    state[id] = (state[id] + dir + total) % total;
    draw(id);
  }

  function draw(id) {
    var track = document.getElementById(id + 'Track');
    var dots  = document.getElementById(id + 'Dots').querySelectorAll('span');
    track.style.transform = 'translateX(-' + (state[id] * 100) + '%)';
    dots.forEach(function(d, i) {
      d.className = (i === state[id]) ? 'on' : '';
    });
  }

  function go(file) {
    window.location.href = file;
  }

  // Swipe support
  function addSwipe(boxId, id) {
    var el = document.getElementById(boxId);
    var sx = 0;
    el.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; }, {passive:true});
    el.addEventListener('touchend',   function(e){
      var dx = sx - e.changedTouches[0].clientX;
      if (Math.abs(dx) > 40) mv(id, dx > 0 ? 1 : -1);
    }, {passive:true});
  }

  addSwipe('cBox', 'c');
  addSwipe('pBox', 'p');
</script>
